<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keyties - Secure Messenger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a0b0d;
            --bg-panel: #141619;
            --bg-item: #1e2126;
            --accent: #007aff; 
            --text-primary: #ffffff;
            --text-secondary: #86868b;
            --border-soft: rgba(255, 255, 255, 0.08);
            --danger: #ff3b30;
            --msg-out: #007aff; 
            --msg-in: #24282d;  
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            height: 100vh;
            display: flex; flex-direction: column;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
        }

        .hidden { display: none !important; }
        
        /* Toast */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #2c2c2e; color: white; padding: 10px 20px;
            border-radius: 24px; font-size: 13px; display: none; z-index: 20000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Custom Modal System */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center;
            z-index: 15000; backdrop-filter: blur(5px); padding: 20px;
        }
        .modal-content {
            background: var(--bg-panel); width: 100%; max-width: 320px;
            border-radius: 24px; border: 1px solid var(--border-soft);
            padding: 24px; transform: scale(0.9); transition: 0.2s;
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; text-align: center; }
        .modal-input {
            width: 100%; padding: 14px; background: var(--bg-item);
            border: 1px solid var(--border-soft); border-radius: 12px;
            color: white; margin-bottom: 16px; font-size: 16px;
        }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            font-weight: 600; cursor: pointer; font-size: 14px;
        }
        .btn-cancel { background: var(--bg-item); color: white; }
        .btn-confirm { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* Header */
        .header {
            display: flex; height: 60px;
            background: var(--bg-panel);
            align-items: center; padding: 0 15px;
            border-bottom: 1px solid var(--border-soft);
            z-index: 100;
        }
        .menu-toggle {
            background: transparent; border: none; color: white;
            margin-right: 10px; cursor: pointer; display: none;
        }
        .brand-logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; margin-right: 15px; color: var(--accent); }
        .friends-list-top { flex: 1; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; align-items: center; }
        .friends-list-top::-webkit-scrollbar { display: none; }
        .friend-tab {
            background: var(--bg-item); padding: 6px 12px; border-radius: 15px; font-size: 12px;
            cursor: pointer; color: var(--text-secondary); transition: 0.2s; white-space: nowrap;
            border: 1px solid transparent;
        }
        .friend-tab.active { border-color: var(--accent); color: white; background: rgba(0, 122, 255, 0.1); }

        /* Main Layout */
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { 
            width: 260px; background: var(--bg-panel); display: flex; 
            flex-direction: column; padding: 20px; border-right: 1px solid var(--border-soft);
            transition: 0.3s transform ease;
        }
        
        .avatar-box { width: 70px; height: 70px; background: var(--bg-item); border-radius: 25px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: var(--accent); border: 2px solid var(--border-soft); }
        .u-name-label { font-weight: 700; text-align: center; font-size: 18px; }
        .u-id-label { font-size: 12px; color: var(--text-secondary); text-align: center; margin: 4px 0 25px; cursor: pointer; background: var(--bg-item); padding: 4px 10px; border-radius: 10px; width: fit-content; align-self: center; }
        
        .sidebar-menu { display: flex; flex-direction: column; gap: 6px; }
        .nav-btn {
            width: 100%; padding: 14px; border-radius: 14px;
            background: transparent; border: none; color: var(--text-primary);
            display: flex; align-items: center; gap: 12px; font-size: 15px;
            cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover { background: var(--bg-item); }
        .nav-btn svg { width: 20px; height: 20px; stroke-width: 2; }
        .nav-btn.danger { color: var(--danger); margin-top: 10px; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-deep); z-index: 10; }
        .chat-header { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-panel); border-bottom: 1px solid var(--border-soft); }
        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message {
            max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 15px;
            cursor: pointer; transition: transform 0.1s; position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .message.outgoing { background: var(--msg-out); align-self: flex-end; border-bottom-right-radius: 4px; color: white; }
        .message.incoming { background: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .msg-img { max-width: 100%; border-radius: 15px; margin-bottom: 5px; display: block; }
        .msg-text-content { word-break: break-word; line-height: 1.4; }
        .msg-meta { font-size: 10px; opacity: 0.6; margin-top: 5px; text-align: right; }
        .edited-mark { font-size: 10px; opacity: 0.5; margin-left: 5px; font-weight: normal; }

        .input-box { padding: 12px 15px; background: var(--bg-panel); border-top: 1px solid var(--border-soft); }
        .input-wrapper { background: var(--bg-item); border-radius: 24px; display: flex; padding: 2px 6px; align-items: center; gap: 4px; }
        .input-wrapper input { flex: 1; border: none; background: transparent; color: white; padding: 12px 10px; font-size: 16px; }

        .icon-btn { 
            background: transparent; border: none; color: var(--text-secondary); 
            cursor: pointer; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: var(--bg-deep); z-index: 25000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 340px; text-align: center; }
        .auth-card h1 { font-size: 42px; font-weight: 900; margin-bottom: 30px; letter-spacing: -2px; }
        .input-field { width: 100%; padding: 18px; margin-bottom: 12px; border-radius: 16px; border: 1px solid var(--border-soft); background: var(--bg-panel); color: white; font-size: 16px; }
        .btn-login { width: 100%; padding: 18px; border-radius: 16px; border: none; background: var(--accent); color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }

        /* Media Queries for Mobile */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar {
                position: absolute; left: 0; top: 0; bottom: 0; z-index: 1000;
                transform: translateX(-100%); width: 280px; box-shadow: 20px 0 50px rgba(0,0,0,0.5);
            }
            .sidebar.active { transform: translateX(0); }
            .sidebar-overlay {
                position: fixed; inset: 0; background: rgba(0,0,0,0.5);
                z-index: 999; display: none;
            }
            .sidebar-overlay.active { display: block; }
        }

        /* Gallery */
        #gallery { position: fixed; inset: 0; background: #000; z-index: 30000; display: none; align-items: center; justify-content: center; }
        #gallery img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="toast" class="toast"></div>

<!-- Custom Modals -->
<div id="modal-confirm" class="modal-overlay" onclick="this.classList.remove('active')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="confirm-title" class="modal-title">Подтвердите действие</div>
        <div class="modal-buttons">
            <button class="modal-btn btn-cancel" onclick="closeConfirm(false)">Отмена</button>
            <button id="confirm-yes-btn" class="modal-btn btn-confirm">Да</button>
        </div>
    </div>
</div>

<div id="modal-prompt" class="modal-overlay" onclick="this.classList.remove('active')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="prompt-title" class="modal-title">Введите данные</div>
        <input type="text" id="prompt-input" class="modal-input" autofocus>
        <div class="modal-buttons">
            <button class="modal-btn btn-cancel" onclick="closePrompt(null)">Отмена</button>
            <button id="prompt-confirm-btn" class="modal-btn btn-confirm">ОК</button>
        </div>
    </div>
</div>

<!-- Message Context Menu -->
<div id="msg-modal" class="modal-overlay" onclick="this.classList.remove('active')">
    <div class="modal-content" style="padding:0; overflow:hidden;" onclick="event.stopPropagation()">
        <button class="nav-btn" style="border-radius:0; padding:18px;" onclick="copyMsgText()">Копировать</button>
        <button id="edit-btn" class="nav-btn" style="border-radius:0; padding:18px;" onclick="startEditMsg()">Изменить</button>
        <button id="del-btn" class="nav-btn danger" style="border-radius:0; padding:18px;" onclick="deleteMsg()">Удалить для всех</button>
    </div>
</div>

<div id="gallery" onclick="this.style.display='none'"><img id="gal-img" src=""></div>

<div id="auth-screen">
    <div class="auth-card">
        <h1>Keyties</h1>
        <input type="text" id="reg-login" class="input-field" placeholder="Логин">
        <input type="password" id="reg-pass" class="input-field" placeholder="Пароль">
        <button class="btn-login" onclick="initUser()">Войти или Регистрация</button>
    </div>
</div>

<div class="header">
    <button class="menu-toggle" onclick="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="brand-logo">Keyties</div>
    <div class="friends-list-top" id="top-friends"></div>
    <button class="icon-btn" onclick="addFriendFlow()" style="color:var(--accent); margin-left: 10px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
</div>

<div class="main-container">
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="avatar-box" id="u-avatar">?</div>
        <div id="u-name" class="u-name-label">...</div>
        <div id="u-id" class="u-id-label" onclick="copyId()">ID: ...</div>
        
        <div class="sidebar-menu">
            <button class="nav-btn" onclick="selectChat('vault', true); toggleSidebar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                Избранное (Сейф)
            </button>
            <button class="nav-btn danger" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Выйти из аккаунта
            </button>
        </div>
    </div>
    
    <div class="chat-area">
        <div class="chat-header">
            <div id="active-chat-title" style="font-weight:700; font-size: 16px;">...</div>
            <button class="icon-btn" id="del-chat-btn" onclick="deleteChatFlow()" style="display:none; color:var(--danger);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
        <div class="messages-container" id="chat-win"></div>
        <div class="input-box">
            <div class="input-wrapper">
                <button class="icon-btn" onclick="document.getElementById('file-in').click()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <input type="file" id="file-in" hidden accept="image/*" onchange="uploadImg(this)">
                <input type="text" id="msg-input" placeholder="Ваше сообщение..." onkeypress="if(event.key==='Enter') sendText()">
                <button class="icon-btn" style="color:var(--accent);" onclick="sendText()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://uqiqqedigyenxvlqqmhg.supabase.co"; 
    const SB_KEY = "sb_publishable_lh3WldQvvA1xWYzcGch6Gw_ruMccFKt"; 
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = "", userUID = "", userPass = "";
    let currentChat = "vault", isVaultActive = true;
    let selectedMsgId = null, editMode = false;

    // --- Session Handling ---
    window.onload = () => {
        const saved = localStorage.getItem('kt_session');
        if(saved) {
            const data = JSON.parse(saved);
            document.getElementById('reg-login').value = data.l;
            document.getElementById('reg-pass').value = data.p;
            initUser();
        }
    };

    function logout() {
        localStorage.removeItem('kt_session');
        location.reload();
    }

    // --- Modal Logic ---
    function openConfirm(title, onYes) {
        document.getElementById('confirm-title').innerText = title;
        const overlay = document.getElementById('modal-confirm');
        overlay.classList.add('active');
        document.getElementById('confirm-yes-btn').onclick = () => {
            overlay.classList.remove('active');
            onYes();
        };
    }
    function closeConfirm() { document.getElementById('modal-confirm').classList.remove('active'); }

    function openPrompt(title, onConfirm) {
        document.getElementById('prompt-title').innerText = title;
        document.getElementById('prompt-input').value = "";
        const overlay = document.getElementById('modal-prompt');
        overlay.classList.add('active');
        document.getElementById('prompt-input').focus();
        document.getElementById('prompt-confirm-btn').onclick = () => {
            const val = document.getElementById('prompt-input').value.trim();
            overlay.classList.remove('active');
            if(val) onConfirm(val);
        };
    }
    function closePrompt() { document.getElementById('modal-prompt').classList.remove('active'); }

    // --- Core Logic ---
    function showToast(m) {
        const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2000);
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function getEncKey(cid) { return isVaultActive ? userPass : cid; }
    function encrypt(t, cid) { return CryptoJS.AES.encrypt(t, getEncKey(cid)).toString(); }
    function decrypt(c, cid) {
        try { 
            const b = CryptoJS.AES.decrypt(c, getEncKey(cid));
            const res = b.toString(CryptoJS.enc.Utf8);
            return res || "🔒 [Зашифровано]";
        } catch(e) { return "🔒 [Ошибка]"; }
    }

    async function initUser() {
        const login = document.getElementById('reg-login').value.trim().toLowerCase();
        const pass = document.getElementById('reg-pass').value;
        if(!login || !pass) return;

        userUID = Math.abs(login.split('').reduce((a,b)=>(((a<<5)-a)+b.charCodeAt(0)),0)|0).toString().slice(0,6).padStart(6,'0');
        const h = CryptoJS.SHA256(pass).toString();

        const { data: cloudUser } = await sb.from('users').select('*').eq('username', login).maybeSingle();
        if(!cloudUser) {
            await sb.from('users').insert({ username: login, password_hash: h, display_id: userUID });
        } else if(cloudUser.password_hash !== h) {
            alert("Неверный пароль"); return;
        }

        user = login; userPass = pass;
        localStorage.setItem('kt_session', JSON.stringify({l: login, p: pass}));

        document.getElementById('u-name').innerText = user;
        document.getElementById('u-avatar').innerText = user[0].toUpperCase();
        document.getElementById('u-id').innerText = "ID: " + userUID;
        document.getElementById('auth-screen').classList.add('hidden');
        
        startRealtime(); refreshChats(); selectChat('vault', true);
    }

    function startRealtime() {
        sb.channel('msgs').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, p => {
            const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
            if(p.eventType === 'INSERT' && p.new.chat_id === cid) renderMsg(p.new, p.new.sender === userUID ? 'outgoing' : 'incoming');
            if(p.eventType === 'DELETE') document.getElementById(`m-${p.old.id}`)?.remove();
            if(p.eventType === 'UPDATE' && p.new.chat_id === cid) {
                const el = document.getElementById(`m-${p.new.id}`);
                if(el) {
                    const raw = decrypt(p.new.content, p.new.chat_id);
                    if(raw.startsWith("text:")) el.querySelector('.msg-text-content').innerText = raw.replace("text:", "");
                    if(p.new.is_edited && !el.querySelector('.edited-mark')) {
                        const m = document.createElement('span'); m.className = 'edited-mark'; m.innerText = '(изм.)';
                        el.querySelector('.msg-text-content').appendChild(m);
                    }
                }
            }
        }).subscribe();
    }

    async function refreshChats() {
        const { data } = await sb.from('messages').select('chat_id').or(`chat_id.ilike.%:${userUID},chat_id.ilike.${userUID}:%`);
        if(!data) return;
        const partners = [...new Set(data.filter(r => !r.chat_id.startsWith('vault')).map(r => r.chat_id.split(':').find(x => x !== userUID)))];
        const { data: uData } = await sb.from('users').select('display_id, username').in('display_id', partners);
        const cont = document.getElementById('top-friends'); cont.innerHTML = "";
        uData?.forEach(u => {
            const d = document.createElement('div'); d.className = 'friend-tab'; d.innerText = u.username;
            d.onclick = () => selectChat(u.display_id, false, d, u.username); cont.appendChild(d);
        });
    }

    async function selectChat(id, vault, el, name = null) {
        currentChat = id; isVaultActive = vault;
        document.querySelectorAll('.friend-tab').forEach(t => t.classList.remove('active'));
        if(el) el.classList.add('active');
        document.getElementById('active-chat-title').innerText = isVaultActive ? "Избранное" : (name || id);
        document.getElementById('del-chat-btn').style.display = isVaultActive ? 'none' : 'block';
        document.getElementById('chat-win').innerHTML = "";
        const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
        const { data } = await sb.from('messages').select('*').eq('chat_id', cid).order('created_at');
        data?.forEach(m => renderMsg(m, m.sender === userUID ? 'outgoing' : 'incoming'));
    }

    async function sendText() {
        const i = document.getElementById('msg-input');
        const t = i.value.trim(); if(!t) return;
        const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
        if(editMode && selectedMsgId) {
            await sb.from('messages').update({ content: encrypt("text:" + t, cid), is_edited: true }).eq('id', selectedMsgId);
            editMode = false; selectedMsgId = null;
        } else {
            await sb.from('messages').insert({ chat_id: cid, sender: userUID, content: encrypt("text:" + t, cid) });
        }
        i.value = ""; i.placeholder = "Ваше сообщение...";
    }

    function renderMsg(m, type) {
        if(document.getElementById(`m-${m.id}`)) return;
        const win = document.getElementById('chat-win');
        const div = document.createElement('div');
        div.id = `m-${m.id}`; div.className = `message ${type}`;
        div.onclick = (e) => { e.stopPropagation(); openMenu(m.id, m.sender === userUID); };

        const raw = decrypt(m.content, m.chat_id);
        if(raw.startsWith("img:")) {
            const img = document.createElement('img'); img.src = raw.replace("img:", ""); img.className = 'msg-img';
            img.onclick = (e) => { e.stopPropagation(); document.getElementById('gal-img').src = img.src; document.getElementById('gallery').style.display='flex'; };
            div.appendChild(img);
        } else {
            const txt = document.createElement('div'); txt.className = 'msg-text-content';
            txt.innerText = raw.replace("text:", "");
            if(m.is_edited) { const ed = document.createElement('span'); ed.className='edited-mark'; ed.innerText='(изм.)'; txt.appendChild(ed); }
            div.appendChild(txt);
        }

        const meta = document.createElement('div'); meta.className = 'msg-meta';
        meta.innerText = new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        div.appendChild(meta); win.appendChild(div); win.scrollTop = win.scrollHeight;
    }

    async function uploadImg(input) {
        const file = input.files[0]; if(!file) return;
        if(file.size > 1024 * 1024) { showToast("Файл слишком большой (>1MB)"); return; }
        const reader = new FileReader();
        reader.onload = async (e) => {
            const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
            await sb.from('messages').insert({ chat_id: cid, sender: userUID, content: encrypt("img:" + e.target.result, cid) });
        };
        reader.readAsDataURL(file);
    }

    function openMenu(id, isMine) {
        selectedMsgId = id;
        document.getElementById('msg-modal').classList.add('active');
        document.getElementById('edit-btn').style.display = isMine ? 'flex' : 'none';
        document.getElementById('del-btn').style.display = isMine ? 'flex' : 'none';
    }

    function copyMsgText() {
        const el = document.getElementById(`m-${selectedMsgId}`).querySelector('.msg-text-content');
        if(el) { navigator.clipboard.writeText(el.innerText.replace('(изм.)', '')); showToast("Скопировано"); }
        document.getElementById('msg-modal').classList.remove('active');
    }

    function startEditMsg() {
        const el = document.getElementById(`m-${selectedMsgId}`).querySelector('.msg-text-content');
        if(el) { 
            const i = document.getElementById('msg-input');
            i.value = el.innerText.replace('(изм.)', ''); i.focus();
            i.placeholder = "Редактирование..."; editMode = true;
        }
        document.getElementById('msg-modal').classList.remove('active');
    }

    async function deleteMsg() {
        openConfirm("Удалить это сообщение для всех?", async () => {
            await sb.from('messages').delete().eq('id', selectedMsgId);
            document.getElementById('msg-modal').classList.remove('active');
        });
    }

    async function deleteChatFlow() {
        openConfirm("Очистить историю этого чата?", async () => {
            const cid = [userUID, currentChat].sort().join(':');
            await sb.from('messages').delete().eq('chat_id', cid);
            document.getElementById('chat-win').innerHTML = "";
            showToast("Чат очищен");
        });
    }

    async function addFriendFlow() {
        openPrompt("Введите ID пользователя:", async (id) => {
            const { data } = await sb.from('users').select('username').eq('display_id', id).maybeSingle();
            if(data) {
                selectChat(id, false, null, data.username);
                refreshChats();
            } else showToast("Пользователь не найден");
        });
    }

    function copyId() { 
        navigator.clipboard.writeText(userUID); 
        showToast("Ваш ID скопирован"); 
    }
</script>
</body>
</html>
