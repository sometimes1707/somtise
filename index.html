<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyties - Secure Messenger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a0b0d;
            --bg-panel: #141619;
            --bg-item: #1e2126;
            --accent: #007aff; 
            --text-primary: #ffffff;
            --text-secondary: #86868b;
            --border-soft: rgba(255, 255, 255, 0.08);
            --danger: #ff3b30;
            --msg-out: #007aff; 
            --msg-in: #24282d;  
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex; flex-direction: column;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* UI Helpers */
        .hidden { display: none !important; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #2c2c2e; color: white; padding: 10px 20px;
            border-radius: 24px; font-size: 13px; display: none; z-index: 5000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Header & Tabs */
        .header {
            display: flex; height: 64px;
            background: var(--bg-panel);
            align-items: center; padding: 0 20px;
            border-bottom: 1px solid var(--border-soft);
            z-index: 100;
        }

        .brand-logo { font-weight: 700; font-size: 19px; letter-spacing: -0.5px; margin-right: 20px; }

        .btn-action-plus {
            background: var(--accent); color: white; border: none;
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; flex-shrink: 0;
        }

        .friends-list-top {
            flex: 1; display: flex; gap: 8px;
            margin: 0 15px; overflow-x: auto; scrollbar-width: none;
        }
        .friends-list-top::-webkit-scrollbar { display: none; }

        .friend-tab {
            background: var(--bg-item); padding: 7px 14px;
            border-radius: 18px; font-size: 13px;
            border: 1px solid transparent; cursor: pointer;
            color: var(--text-secondary); transition: 0.2s;
            white-space: nowrap;
        }
        .friend-tab.active { border-color: var(--accent); color: white; background: rgba(0, 122, 255, 0.15); }

        /* Sidebar */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 240px; background: var(--bg-panel);
            display: flex; flex-direction: column;
            padding: 20px; border-right: 1px solid var(--border-soft);
        }

        .avatar-box {
            width: 64px; height: 64px; background: var(--bg-item);
            border-radius: 50%; margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 600; color: var(--accent);
            border: 1px solid var(--border-soft);
        }
        .u-name-label { font-weight: 600; font-size: 16px; text-align: center; }
        .u-id-label { font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 4px; cursor: pointer; }

        .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
        .icon-btn {
            width: 100%; display: flex; align-items: center; gap: 12px;
            padding: 12px; background: transparent;
            border: none; border-radius: 10px;
            color: var(--text-secondary); cursor: pointer; transition: 0.2s;
            font-size: 14px;
        }
        .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
        .icon-btn:hover, .icon-btn.active { background: var(--bg-item); color: white; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header {
            height: 56px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-panel); border-bottom: 1px solid var(--border-soft);
        }

        .messages-container { 
            flex: 1; padding: 20px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 10px;
        }
        
        .message {
            max-width: 75%; padding: 10px 14px; border-radius: 18px;
            font-size: 15px; position: relative; line-height: 1.4;
            animation: msgIn 0.3s ease-out forwards;
            word-wrap: break-word;
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.outgoing { background: var(--msg-out); align-self: flex-end; color: white; border-bottom-right-radius: 4px; }
        .message.incoming { background: var(--msg-in); align-self: flex-start; color: white; border-bottom-left-radius: 4px; }

        .message-img {
            max-width: 220px; border-radius: 12px;
            margin-top: 4px; display: block;
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            cursor: pointer; transition: transform 0.2s;
        }
        .message-img:hover { transform: scale(1.02); }

        .msg-meta { font-size: 10px; opacity: 0.6; margin-top: 5px; display: flex; justify-content: flex-end; }

        .input-box { padding: 16px 20px; }
        .input-wrapper {
            background: var(--bg-panel); border: 1px solid var(--border-soft);
            border-radius: 16px; display: flex; padding: 4px 12px; align-items: center; gap: 8px;
        }
        .input-wrapper input[type="text"] {
            flex: 1; border: none; background: transparent; color: white; padding: 12px 0; font-size: 15px;
        }

        /* Gallery Overlay */
        #gallery-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 6000; display: none; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #gallery-img { 
            max-width: 90%; max-height: 80%; 
            object-fit: contain; border-radius: 4px; 
            transition: all 0.3s ease;
        }
        #gallery-img.fullscreen { max-width: 100vw; max-height: 100vh; border-radius: 0; }
        
        .gallery-controls {
            position: absolute; bottom: 40px; display: flex; gap: 30px; align-items: center;
        }
        .gal-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .gal-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; }
        .gal-close { position: absolute; top: 20px; right: 20px; }

        /* Auth & Modals */
        #auth-screen { position: fixed; inset: 0; background: var(--bg-deep); z-index: 3000; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 320px; text-align: center; }
        .input-field {
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid var(--border-soft); background: var(--bg-panel); color: white;
        }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-card { background: var(--bg-panel); width: 90%; max-width: 340px; padding: 24px; border-radius: 24px; }

        .btn-icon-only { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 8px; display: flex; }
        .btn-icon-only svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
    </style>
</head>
<body>

<div id="toast" class="toast">Уведомление</div>

<div id="gallery-overlay">
    <button class="gal-btn gal-close" onclick="closeGallery()">
        <svg viewBox="0 0 24 24" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <img id="gallery-img" src="" ondblclick="toggleFullscreen(this)">
    <div class="gallery-controls">
        <button class="gal-btn" onclick="navGallery(-1)">
            <svg viewBox="0 0 24 24" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="gal-btn" onclick="navGallery(1)">
            <svg viewBox="0 0 24 24" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h2 style="margin-bottom: 32px; font-weight: 800; letter-spacing: -1.5px; font-size: 28px;">Keyties</h2>
        <input type="text" id="reg-login" class="input-field" placeholder="Логин">
        <input type="password" id="reg-pass" class="input-field" placeholder="Пароль">
        <button class="icon-btn" style="background:var(--accent); color:white; justify-content:center; padding:14px;" onclick="initUser()">Войти</button>
    </div>
</div>

<div class="header">
    <div class="brand-logo">Keyties</div>
    <button class="btn-action-plus" onclick="addNewFriendPrompt()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <div class="friends-list-top" id="top-friends"></div>
</div>

<div class="main-container">
    <div class="sidebar">
        <div class="avatar-box" id="u-avatar">?</div>
        <div id="u-name" class="u-name-label">...</div>
        <div id="u-id" class="u-id-label" onclick="copyId()">ID: ...</div>
        <div class="sidebar-footer">
            <button class="icon-btn" id="fav-trigger" onclick="selectChat('vault', true)">
                <svg viewBox="0 0 24 24" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg> Избранное
            </button>
            <button class="icon-btn" onclick="logout()">
                <svg viewBox="0 0 24 24" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Выход
            </button>
        </div>
    </div>
    
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-title" id="active-chat-title">Выберите чат</div>
            <button class="btn-icon-only" onclick="clearHistory()"><svg viewBox="0 0 24 24" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
        </div>
        <div class="messages-container" id="chat-win"></div>
        <div class="input-box">
            <div class="input-wrapper">
                <button class="btn-icon-only" onclick="document.getElementById('photo-input').click()">
                    <svg viewBox="0 0 24 24" stroke-width="2" style="transform: rotate(45deg)"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="uploadMultiple(this)">
                <input type="text" id="msg-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendText()">
                <button class="btn-icon-only" style="color:var(--accent);" onclick="sendText()"><svg viewBox="0 0 24 24" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://uqiqqedigyenxvlqqmhg.supabase.co"; 
    const SB_KEY = "sb_publishable_lh3WldQvvA1xWYzcGch6Gw_ruMccFKt"; 
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = "", userUID = "", userPass = "";
    let currentChat = "vault", isVaultActive = true;
    let galleryImages = [];
    let currentGalIndex = 0;

    function showToast(m) {
        const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    }

    // НОВОЕ: Генерация ключа шифрования на основе ID собеседников
    function getEncryptionKey(cid) {
        if (isVaultActive) return userPass; // Для избранного используем пароль
        return cid; // Для чатов используем ID чата (user1:user2) как общий секрет для простоты
    }

    function encrypt(t, cid) { 
        return CryptoJS.AES.encrypt(t, getEncryptionKey(cid)).toString(); 
    }

    function decrypt(c, cid) {
        try { 
            const bytes = CryptoJS.AES.decrypt(c, getEncryptionKey(cid));
            const original = bytes.toString(CryptoJS.enc.Utf8);
            return original || "[Зашифровано]"; 
        } catch(e) { return "[Зашифровано]"; }
    }

    function generateID(login) {
        let h = 0; for(let i=0; i<login.length; i++) h = ((h << 5) - h) + login.charCodeAt(i);
        return Math.abs(h|0).toString().slice(0,6).padStart(6,'0');
    }

    async function initUser() {
        const login = document.getElementById('reg-login').value.trim().toLowerCase();
        const pass = document.getElementById('reg-pass').value;
        if(!login || !pass) return;

        userUID = generateID(login);
        const h = CryptoJS.SHA256(pass).toString();

        const { data: cloudUser } = await sb.from('users').select('*').eq('username', login).maybeSingle();
        
        if(!cloudUser) { 
            await sb.from('users').insert({ username: login, password_hash: h, display_id: userUID }); 
        } else if(cloudUser.password_hash !== h) { 
            alert("Неверный пароль"); return; 
        }

        user = login; userPass = pass;
        document.getElementById('u-name').innerText = user;
        document.getElementById('u-avatar').innerText = user[0].toUpperCase();
        document.getElementById('u-id').innerText = "ID: " + userUID;
        document.getElementById('auth-screen').classList.add('hidden');
        
        startRealtime(); 
        refreshChats(); 
        selectChat('vault', true);
    }

    function startRealtime() {
        sb.channel('global_msgs').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
            const m = p.new;
            const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
            
            if(m.chat_id === cid) {
                renderMsg(m, m.sender === userUID ? 'outgoing' : 'incoming');
            }
            
            if(m.chat_id.includes(userUID)) {
                refreshChats();
            }
        }).subscribe();

        sb.channel('del_msgs').on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, p => {
            document.getElementById(`m-${p.old.id}`)?.remove();
        }).subscribe();
    }

    async function refreshChats() {
        const { data } = await sb.from('messages').select('chat_id').or(`chat_id.ilike.%:${userUID},chat_id.ilike.${userUID}:%`);
        if(!data) return;
        
        const partners = [...new Set(data.filter(r => !r.chat_id.startsWith('vault')).map(r => r.chat_id.split(':').find(x => x !== userUID)))];
        if(partners.length === 0) return;

        const { data: userData } = await sb.from('users').select('display_id, username').in('display_id', partners);
        const cont = document.getElementById('top-friends'); cont.innerHTML = "";
        
        if(userData) userData.forEach(u => {
            const d = document.createElement('div'); 
            d.className = `friend-tab ${(!isVaultActive && currentChat === u.display_id) ? 'active' : ''}`; 
            d.innerText = u.username;
            d.onclick = () => selectChat(u.display_id, false, d, u.username); 
            cont.appendChild(d);
        });
    }

    async function selectChat(id, vault, el, username = null) {
        currentChat = id; isVaultActive = vault;
        document.querySelectorAll('.friend-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('fav-trigger').classList.toggle('active', vault);
        if(el) el.classList.add('active');
        
        document.getElementById('active-chat-title').innerText = isVaultActive ? "Избранное" : (username || id);
        document.getElementById('chat-win').innerHTML = "";
        
        const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
        const { data } = await sb.from('messages').select('*').eq('chat_id', cid).order('created_at');
        if(data) data.forEach(m => renderMsg(m, m.sender === userUID ? 'outgoing' : 'incoming'));
    }

    async function sendText() {
        const i = document.getElementById('msg-input');
        const t = i.value.trim(); if(!t) return;
        const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
        
        await sb.from('messages').insert({ 
            chat_id: cid, 
            sender: userUID, 
            content: encrypt("text:" + t, cid) 
        });
        i.value = "";
    }

    async function uploadMultiple(input) {
        if (!input.files.length) return;
        const files = Array.from(input.files).slice(0, 5);
        const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
        
        showToast(`Загрузка...`);
        
        for(let file of files) {
            if(file.size > 1024 * 1024) { showToast("Файл слишком большой"); continue; }
            const reader = new FileReader();
            reader.onload = async (e) => {
                await sb.from('messages').insert({ 
                    chat_id: cid, sender: userUID, content: encrypt("img:" + e.target.result, cid) 
                });
            };
            reader.readAsDataURL(file);
        }
        input.value = "";
    }

    function renderMsg(m, type) {
        if(document.getElementById(`m-${m.id}`)) return;
        const win = document.getElementById('chat-win');
        const div = document.createElement('div');
        div.id = `m-${m.id}`; div.className = `message ${type}`;
        
        const raw = decrypt(m.content, m.chat_id);
        const time = new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        
        if(raw.startsWith("img:")) {
            const src = raw.replace("img:", "");
            const img = document.createElement('img');
            img.src = src; img.className = 'message-img';
            img.onclick = () => openGallery(src);
            div.appendChild(img);
        } else {
            const txt = document.createElement('div');
            txt.innerText = raw.replace("text:", "");
            div.appendChild(txt);
        }

        const meta = document.createElement('div'); meta.className = 'msg-meta'; meta.innerText = time;
        div.appendChild(meta); win.appendChild(div); win.scrollTop = win.scrollHeight;
        updateGalleryList();
    }

    function updateGalleryList() {
        galleryImages = Array.from(document.querySelectorAll('.message-img')).map(img => img.src);
    }

    function openGallery(src) {
        const overlay = document.getElementById('gallery-overlay');
        const gImg = document.getElementById('gallery-img');
        currentGalIndex = galleryImages.indexOf(src);
        gImg.src = src;
        overlay.style.display = 'flex';
        gImg.classList.remove('fullscreen');
    }

    function closeGallery() { document.getElementById('gallery-overlay').style.display = 'none'; }

    function navGallery(dir) {
        currentGalIndex += dir;
        if(currentGalIndex < 0) currentGalIndex = galleryImages.length - 1;
        if(currentGalIndex >= galleryImages.length) currentGalIndex = 0;
        document.getElementById('gallery-img').src = galleryImages[currentGalIndex];
    }

    function toggleFullscreen(img) { img.classList.toggle('fullscreen'); }

    async function addNewFriendPrompt() {
        const id = prompt("Введите ID друга (6 цифр):");
        if(id && id !== userUID) {
            const { data } = await sb.from('users').select('username').eq('display_id', id).maybeSingle();
            if(data) {
                selectChat(id, false, null, data.username);
                refreshChats();
            } else {
                alert("Пользователь с таким ID не найден");
            }
        }
    }

    async function clearHistory() {
        if(!confirm("Удалить всю историю этого чата?")) return;
        const cid = isVaultActive ? `vault:${userUID}` : [userUID, currentChat].sort().join(':');
        await sb.from('messages').delete().eq('chat_id', cid);
        document.getElementById('chat-win').innerHTML = "";
    }

    function copyId() { 
        const el = document.createElement('textarea');
        el.value = userUID; document.body.appendChild(el);
        el.select(); document.execCommand('copy');
        document.body.removeChild(el);
        showToast("ID скопирован"); 
    }
    function logout() { location.reload(); }
</script>
</body>
</html>
